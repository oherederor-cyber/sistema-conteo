{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Conteo de Personas{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'conteo/css/estilos.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'conteo:inicio' %}"><i class="bi bi-people-fill"></i> Conteo Lab</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        {% if camara %}
        <li class="nav-item"><a class="nav-link" href="{% url 'conteo:dashboard' camara.pk %}"><i class="bi bi-camera-video"></i> En vivo</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'conteo:historial' camara.pk %}"><i class="bi bi-graph-up"></i> Historial</a></li>
        {% endif %}
        <li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}"><i class="bi bi-gear"></i> Administración</a></li>
      </ul>
      {% if camaras|length > 1 %}
      <select class="form-select form-select-sm w-auto" onchange="location.href=this.value">
        {% for c in camaras %}
        <option value="{% url 'conteo:dashboard' c.pk %}" {% if c.pk == camara.pk %}selected{% endif %}>{{ c.nombre }}</option>
        {% endfor %}
      </select>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container-fluid py-3">
  {% block contenido %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
